services:
  db:
    image: postgres:17
    container_name: revolver-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: revolver
      POSTGRES_USER: revolver
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revolver -d revolver"]
      interval: 10s
      timeout: 5s
      retries: 5

  revolver-ui:
    image: dakucheri/revolver-app-ui:latest
    container_name: revolver-ui
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      APP_MODE: LINE1
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/revolver?options=-c%20TimeZone=Europe/Moscow
      SPRING_DATASOURCE_USERNAME: revolver
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      APP_UI_USERNAME: ${APP_UI_USERNAME}
      APP_UI_PASSWORD: ${APP_UI_PASSWORD}
      APP_AUTH: ${APP_AUTH}
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  db2:
    image: postgres:17
    container_name: revolver2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: revolver2
      POSTGRES_USER: revolver2
      POSTGRES_PASSWORD: ${DB2_PASSWORD}
      TZ: Europe/Moscow
    volumes:
      - revolver2-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revolver2 -d revolver2"]
      interval: 10s
      timeout: 5s
      retries: 5

  revolver-ui2:
    image: dakucheri/revolver-app-ui:latest
    container_name: revolver-ui2
    restart: unless-stopped
    depends_on:
      db2:
        condition: service_healthy
    ports:
      - "8083:8080"
    environment:
      APP_MODE: LINE2
      SPRING_DATASOURCE_URL: jdbc:postgresql://db2:5432/revolver2?options=-c%20TimeZone=Europe/Moscow
      SPRING_DATASOURCE_USERNAME: revolver2
      SPRING_DATASOURCE_PASSWORD: ${DB2_PASSWORD}
      APP_UI_USERNAME: ${APP_UI_USERNAME}
      APP_UI_PASSWORD: ${APP_UI_PASSWORD}
      APP_AUTH: ${APP_AUTH}
      TZ: Europe/Moscow
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  pgdata:
  revolver2-db-data: